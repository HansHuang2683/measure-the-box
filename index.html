<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBA 装箱优化工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=6">
    <!-- CDN 依赖 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="container">

    <!-- Header -->
    <div class="header">
        <div>
            <h1>📦 FBA 装箱优化工具</h1>
            <div class="subtitle">输入产品和箱子尺寸，自动计算最优装箱方案，满足5箱免配置费要求</div>
        </div>
        <div style="display:flex;gap:8px;">
            <button class="btn btn-outline" onclick="importXlsx()" style="border-color:rgba(255,255,255,0.5);color:#fff;">导入 xlsx</button>
            <input type="file" id="xlsxInput" accept=".xlsx" style="display:none" onchange="handleXlsxImport(event)">
        </div>
    </div>

    <!-- Step 1: SKU Management -->
    <div class="section">
        <div class="section-title">第一步：SKU 管理</div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="addSkuRow()">+ 添加 SKU</button>
            <button class="btn btn-outline" onclick="loadDemoData()">📋 加载示例数据</button>
        </div>
        <div style="overflow-x:auto;">
            <table id="skuTable">
                <thead>
                    <tr>
                        <th style="width:18%;">SKU 名称</th>
                        <th style="width:10%;">长 (cm)</th>
                        <th style="width:10%;">宽 (cm)</th>
                        <th style="width:10%;">高 (cm)</th>
                        <th style="width:8%;">数量</th>
                        <th style="width:10%;">包装类型</th>
                        <th style="width:8%;">公差%</th>
                        <th style="width:8%;">操作</th>
                    </tr>
                </thead>
                <tbody id="skuBody">
                    <!-- Dynamic rows -->
                </tbody>
            </table>
        </div>
        <div class="empty-state" id="skuEmpty">
            <div class="icon">📋</div>
            <div>还没有添加 SKU，点击上方按钮添加或从 xlsx 导入</div>
        </div>
    </div>

    <!-- Step 2: Box Types -->
    <div class="section">
        <div class="section-title">第二步：箱子类型</div>
        <div class="box-add-area">
            <div class="form-group" style="min-width:200px;">
                <label>快速添加标准箱规</label>
                <select id="stdBoxSelect" style="padding:6px 10px;border:1px solid #ddd;border-radius:4px;width:100%;">
                    <option value="">-- 选择 --</option>
                </select>
            </div>
            <button class="btn btn-primary" style="align-self:flex-end;" onclick="addSelectedStdBox()">+ 添加</button>
            <button class="btn btn-outline" style="align-self:flex-end;" onclick="addAllStdBoxes()">一键添加所有箱型</button>
            <div class="form-group" style="min-width:70px;">
                <label>或自定义长</label>
                <input type="number" id="custBoxL" step="0.1" min="0.1" placeholder="长" style="width:100%;">
            </div>
            <div class="form-group" style="min-width:70px;">
                <label>宽</label>
                <input type="number" id="custBoxW" step="0.1" min="0.1" placeholder="宽" style="width:100%;">
            </div>
            <div class="form-group" style="min-width:70px;">
                <label>高</label>
                <input type="number" id="custBoxH" step="0.1" min="0.1" placeholder="高" style="width:100%;">
            </div>
            <div class="form-group" style="min-width:60px;">
                <label>壁厚</label>
                <input type="number" id="custBoxWall" step="0.1" min="0.1" value="1.0" style="width:100%;">
            </div>
            <button class="btn btn-outline" style="align-self:flex-end;" onclick="addCustomBox()">添加自定义</button>
        </div>
        <div id="boxTypeChips">
            <!-- Box type chips generated by JS -->
        </div>
        <div class="empty-state" id="boxEmpty" style="display:none;">
            <div class="icon">📦</div>
            <div>还没有添加箱子类型，从上方选择标准箱规或自定义添加</div>
        </div>
    </div>

    <!-- Step 3: Mixed Groups -->
    <div class="section">
        <div class="section-title">第三步：混装组配置</div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="addMixedGroup()">+ 新建混装组</button>
            <button class="btn btn-outline" onclick="autoCreateGroups()">⚡ 自动分配方案</button>
            <button class="btn btn-success" onclick="validateAll()">✅ 验证所有混装组</button>
        </div>
        <div id="groupsContainer">
            <!-- Mixed group cards -->
        </div>
        <div class="empty-state" id="groupEmpty">
            <div class="icon">🔗</div>
            <div>还没有混装组，点击"新建混装组"手动配置，或"自动分配方案"快速生成</div>
        </div>
    </div>

    <!-- Step 4: Results -->
    <div class="section" id="resultsSection" style="display:none;">
        <div class="section-title">第四步：结果</div>
        <div class="btn-group">
            <button class="btn btn-success" onclick="exportXlsx()">📤 导出 xlsx</button>
            <button class="btn btn-outline" onclick="printReport()">🖨️ 打印报告</button>
        </div>

        <!-- Summary -->
        <div id="resultsSummary" class="summary"></div>

        <!-- Custom box suggestion -->
        <div id="customBoxSuggestion" style="margin-top:12px;"></div>

        <!-- Per-group results -->
        <div id="resultsGroups"></div>

        <!-- 3D Viewer -->
        <div style="margin-top:16px;">
            <div class="section-title">3D 可视化</div>
            <div class="viewer-controls">
                <select id="viewerSelect" class="form-group" style="min-width:200px;" onchange="refreshViewer()">
                    <option value="">-- 选择一个箱子预览 --</option>
                </select>
                <button class="btn btn-sm btn-outline" onclick="refreshViewer()">刷新</button>
                <button class="btn btn-sm btn-outline" onclick="onEnterSandbox()">🖐 沙盘模式</button>
                <button class="btn btn-sm btn-outline" id="cavityToggle" onclick="toggleCavityAlgorithm()">空腔吸附: OFF</button>
                <button class="btn btn-sm btn-outline" id="cavityShowToggle" onclick="toggleCavityViewer()" style="display:none;">显示空腔: OFF</button>
                <button class="btn btn-sm btn-outline" id="replenishmentBtn" onclick="toggleReplenishmentPanel()">补货推荐</button>
            </div>
            <div id="viewer-container">
                <div class="viewer-empty">选择上方下拉菜单中的箱子查看 3D 布局</div>
            </div>
            <div id="replenishmentPanel" style="margin-top:12px;display:none;"></div>
            <div id="cavityDiagnostics" style="margin-top:8px;display:none;"></div>
        </div>
    </div>

</div>

<!-- Scripts (order matters) -->
<script src="js/config.js"></script>
<script src="js/algorithm.js"></script>
<script src="js/algorithm-mixed.js?v=2"></script>
<script src="js/algorithm-cavity.js?v=4"></script>
<script src="js/replenishment.js?v=2"></script>
<script src="js/distribution.js"></script>
<script src="js/customBox.js?v=2"></script>
<script src="js/xlsxHandler.js"></script>
<script src="js/renderer3d.js?v=12"></script>
<script src="js/ui.js?v=3"></script>
<script src="js/draft.js"></script>
	<script src="js/auth.js"></script>
</body>
</html>
